name: efcpt-ui

on:
  workflow_dispatch:
  push:
    branches:
      - 'master'
    paths:
      - '.github/workflows/efcpt-ui.yml'
      - 'packages/efcpt-ui/**'
      - 'samples/efcpt-config.schema.json'
      - 'src/Core/**'
      - 'src/GUI/RevEng.Shared/**'
  pull_request:
    branches:
      - '*'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/efcpt-ui

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: packages/efcpt-ui/package-lock.json

    - run: npm ci

    # Formatting and generated files are checked once; Windows checkouts may have CRLF line endings
    - name: Schema types up to date
      if: runner.os == 'Linux'
      run: npm run check-schema

    - name: Lint and format
      if: runner.os == 'Linux'
      run: |
        npm run lint
        npm run format:check

    - run: npm run typecheck

    - run: npm test

    - run: npm run build

    - name: Browser tests of the web UI
      if: runner.os == 'Linux'
      run: |
        npx playwright install --with-deps chromium
        npm run test:ui

    - name: Pack, install and run
      shell: bash
      run: |
        npm pack --pack-destination "$RUNNER_TEMP"
        mkdir "$RUNNER_TEMP/consumer" && cd "$RUNNER_TEMP/consumer"
        npm init -y > /dev/null
        npm install --no-audit --no-fund "$RUNNER_TEMP"/efcpt-ui-*.tgz
        npx efcpt-ui --version
        npx efcpt-ui --help > /dev/null

  e2e:
    runs-on: ubuntu-latest

    # Throwaway SQL Server for the SQL Server end to end test; the password only exists inside this job
    services:
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: 'Y'
          MSSQL_SA_PASSWORD: Efcpt_Ci_Test_1234
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Efcpt_Ci_Test_1234 -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: packages/efcpt-ui/package-lock.json

    - name: Build engine (EF Core 10) and the Visual Studio extension's code generator
      working-directory: .
      run: |
        dotnet build src/Core/efcpt.10/efcpt.10.csproj -c Release
        dotnet build src/Core/efreveng100/efreveng100.csproj -c Release

    - run: npm ci

    - name: Create the SQL Server test database
      working-directory: .
      run: |
        docker cp packages/efcpt-ui/test/fixtures/mssql/tricky.sql ${{ job.services.mssql.id }}:/tmp/tricky.sql
        docker exec ${{ job.services.mssql.id }} /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P Efcpt_Ci_Test_1234 -C -I -b -i /tmp/tricky.sql

    - name: End to end (SQLite and SQL Server, compile the result, parity with the VS extension)
      env:
        EFCPT_UI_E2E_ENGINE: ${{ github.workspace }}/src/Core/efcpt.10/bin/Release/net10.0/efcpt.10.dll
        EFCPT_UI_E2E_REVENG: ${{ github.workspace }}/src/Core/efreveng100/bin/Release/net10.0/efreveng100.dll
        EFCPT_UI_E2E_MSSQL: Server=localhost,1433;Database=Tricky;User Id=sa;Password=Efcpt_Ci_Test_1234;TrustServerCertificate=true
        EFCPT_UI_E2E_BUILD: '1'
      run: npx vitest run test/e2e.test.ts

  # Windows authentication end to end: LocalDB only accepts Windows (integrated) authentication, so this
  # proves the CLI -> engine -> SqlClient -> SSPI path on Windows, including backslashes in the server name
  e2e-windows-auth:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v7

    - uses: actions/setup-dotnet@v6
      with:
        dotnet-version: '10.0.x'

    - uses: actions/setup-node@v5
      with:
        node-version: '22'
        cache: npm
        cache-dependency-path: packages/efcpt-ui/package-lock.json

    - name: Start SQL Server LocalDB
      shell: pwsh
      working-directory: .
      run: |
        if (-not (Get-Command SqlLocalDB -ErrorAction SilentlyContinue)) {
          choco install sqllocaldb -y --no-progress
          $env:PATH = [Environment]::GetEnvironmentVariable('PATH', 'Machine') + ';' + $env:PATH
        }
        SqlLocalDB create MSSQLLocalDB -s 2>$null
        SqlLocalDB start MSSQLLocalDB
        SqlLocalDB info MSSQLLocalDB

    - name: Create the test database (Windows authentication)
      shell: powershell
      working-directory: .
      run: |
        $connection = New-Object System.Data.SqlClient.SqlConnection 'Server=(localdb)\MSSQLLocalDB;Integrated Security=true;Database=master'
        $connection.Open()
        $script = Get-Content -Raw packages\efcpt-ui\test\fixtures\mssql\tricky.sql
        foreach ($batch in ($script -split '(?m)^\s*GO\s*$')) {
          if ($batch.Trim()) {
            $command = $connection.CreateCommand()
            $command.CommandText = $batch
            [void]$command.ExecuteNonQuery()
          }
        }
        $connection.Close()

    - name: Build engine (EF Core 10)
      working-directory: .
      run: dotnet build src/Core/efcpt.10/efcpt.10.csproj -c Release

    - run: npm ci

    - name: End to end with Windows authentication
      env:
        EFCPT_UI_E2E_ENGINE: ${{ github.workspace }}\src\Core\efcpt.10\bin\Release\net10.0\efcpt.10.dll
        EFCPT_UI_E2E_MSSQL: Server=(localdb)\MSSQLLocalDB;Database=Tricky;Trusted_Connection=True
        EFCPT_UI_E2E_BUILD: '1'
      run: npx vitest run test/e2e.test.ts
